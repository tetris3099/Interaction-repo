name: Interaction Dispatch gitHub
on:
  {
    workflow_dispatch: { secrets: { PASSWORD: { description: 'Password field', required: true } } },
  }

jobs:
  console-log:
    runs-on: ubuntu-latest
    steps:
      - name: Print password
        run: echo '${{secrets.PASSWORD}}'
      - name: Print gitRepo
        run: echo '${{toJson(github)}}'

  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ls -a
